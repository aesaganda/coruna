services:
  coruna:
    build:
      context: .
      dockerfile: Dockerfile
    image: coruna:latest
    container_name: coruna
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      # HTTP Exploit Delivery Server (Targets connect here via Safari)
      - "80:80"
      # C2 TCP Listener (Implants connect back here)
      - "8080:8080"
    environment:
      - WEB_SERVER_IP=0.0.0.0
      - WEB_SERVER_PORT=80
      - C2_BIND=0.0.0.0
      - C2_PORT=8080
      # Set CORUNA_HEADLESS=1 to disable interactive prompt when running in the background
      - CORUNA_HEADLESS=0
    volumes:
      # Optional persistence and custom payload mounts
      - ./exploits:/app/exploits
      - ./web_server/static:/app/web_server/static
      # Uncomment to use an external config file:
      # - ./config.json:/app/config.json
